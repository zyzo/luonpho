<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e6db" />
    <meta
      name="description"
      content="Lượn Phố — a three-minute motorcycle daydream through the beautiful chaos of a Vietnamese street."
    />
    <title>Lượn Phố — A little ride through Vietnam</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23de512f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='48' fill='%23fff2cf'%3El%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="app">
      <div
        id="scene"
        aria-label="Animated third-person motorcycle ride through a Vietnamese street"
      ></div>
      <div class="vignette"></div>
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Lượn Phố home"
          >lượn phố<span class="brand-dot">.</span></a
        >
      </header>
      <section class="intro" id="intro">
        <h1>Hop on.<br />Feel the <em>Viet street.</em></h1>
        <button id="start" class="start-button">
          <span class="play-icon">▶</span> Take a ride
          <span class="button-arrow">↗</span>
        </button>
      </section>
      <aside class="place-caption">
        <span class="place">Sài Gòn <span> / </span> Giờ tan tầm</span>
      </aside>
      <footer class="ride-controls">
        <div class="speedometer">
          <div
            id="speed-gauge"
            role="meter"
            aria-label="Speed in kilometres per hour"
            aria-valuemin="0"
            aria-valuemax="120"
            aria-valuenow="30"
          >
            <svg class="speed-dial" viewBox="0 0 240 240" aria-hidden="true">
              <defs>
                <linearGradient id="chrome" x2=".8" y2="1">
                  <stop stop-color="#fcf9e9" />
                  <stop offset=".22" stop-color="#454b4b" />
                  <stop offset=".48" stop-color="#b5b7ae" />
                  <stop offset=".65" stop-color="#161c1d" />
                  <stop offset="1" stop-color="#b9b9ac" />
                </linearGradient>
                <radialGradient id="dial-face" cx=".4" cy=".25" r=".85">
                  <stop stop-color="#465354" />
                  <stop offset="1" stop-color="#17272c" />
                </radialGradient>
                <linearGradient id="glass" x2=".3" y2="1">
                  <stop stop-color="#ffffff" stop-opacity=".16" />
                  <stop offset=".6" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
              </defs>
              <circle cx="120" cy="120" r="118" fill="#121a1c" />
              <circle cx="120" cy="120" r="114" fill="url(#chrome)" />
              <circle
                cx="120"
                cy="120"
                r="108"
                fill="#101719"
                stroke="#050909"
                stroke-width="3"
              />
              <circle
                cx="120"
                cy="120"
                r="102"
                fill="url(#dial-face)"
                stroke="#6e7875"
              />
              <line
                x1="46.46"
                y1="181.71"
                x2="55.65"
                y2="173.99"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="65.61" y="165.64" class="dial-number">0</text>
              <line
                x1="36.17"
                y1="166.79"
                x2="41.41"
                y2="163.86"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="28.87"
                y1="150.20"
                x2="40.26"
                y2="146.42"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="52.60" y="142.33" class="dial-number">10</text>
              <line
                x1="24.82"
                y1="132.53"
                x2="30.77"
                y2="131.75"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="24.16"
                y1="114.42"
                x2="36.14"
                y2="115.12"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="49.12" y="115.87" class="dial-number">20</text>
              <line
                x1="26.92"
                y1="96.50"
                x2="32.74"
                y2="97.97"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="32.99"
                y1="79.43"
                x2="43.87"
                y2="84.50"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="55.65" y="89.99" class="dial-number">30</text>
              <line
                x1="42.17"
                y1="63.80"
                x2="47.03"
                y2="67.31"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="54.12"
                y1="50.17"
                x2="62.36"
                y2="58.90"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="71.28" y="68.36" class="dial-number">40</text>
              <line
                x1="68.42"
                y1="39.03"
                x2="71.64"
                y2="44.09"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="84.56"
                y1="30.78"
                x2="88.99"
                y2="41.93"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="93.79" y="54.02" class="dial-number">50</text>
              <line
                x1="101.96"
                y1="25.71"
                x2="103.08"
                y2="31.60"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="120.00"
                y1="24.00"
                x2="120.00"
                y2="36.00"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="120.00" y="49.00" class="dial-number">60</text>
              <line
                x1="138.04"
                y1="25.71"
                x2="136.92"
                y2="31.60"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="155.44"
                y1="30.78"
                x2="151.01"
                y2="41.93"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="146.21" y="54.02" class="dial-number">70</text>
              <line
                x1="171.58"
                y1="39.03"
                x2="168.36"
                y2="44.09"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="185.88"
                y1="50.17"
                x2="177.64"
                y2="58.90"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="168.72" y="68.36" class="dial-number">80</text>
              <line
                x1="197.83"
                y1="63.80"
                x2="192.97"
                y2="67.31"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="207.01"
                y1="79.43"
                x2="196.13"
                y2="84.50"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="184.35" y="89.99" class="dial-number">90</text>
              <line
                x1="213.08"
                y1="96.50"
                x2="207.26"
                y2="97.97"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="215.84"
                y1="114.42"
                x2="203.86"
                y2="115.12"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="190.88" y="115.87" class="dial-number">100</text>
              <line
                x1="215.18"
                y1="132.53"
                x2="209.23"
                y2="131.75"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="211.13"
                y1="150.20"
                x2="199.74"
                y2="146.42"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="187.40" y="142.33" class="dial-number">110</text>
              <line
                x1="203.83"
                y1="166.79"
                x2="198.59"
                y2="163.86"
                stroke="#e3e4d8"
                stroke-width="1.2"
              />
              <line
                x1="193.54"
                y1="181.71"
                x2="184.35"
                y2="173.99"
                stroke="#e3e4d8"
                stroke-width="2.4"
              />
              <text x="174.39" y="165.64" class="dial-number">120</text>
              <rect
                x="88"
                y="80"
                width="64"
                height="21"
                rx="2"
                fill="#0b1113"
                stroke="#65706c"
              />
              <text id="speed-value" x="120" y="91" class="dial-readout">
                030
              </text>
              <text x="120" y="171" class="dial-unit">km/h</text>
              <text x="120" y="188" class="dial-brand">LƯỢN PHỐ</text>
              <circle cx="120" cy="120" r="101" fill="url(#glass)" />
              <g id="speed-needle" transform="rotate(-155 120 120)">
                <path
                  d="M99 116 L207 118 L211 120 L207 122 L99 124 Z"
                  fill="#eee9d6"
                  stroke="#929b93"
                  stroke-width=".6"
                />
                <path
                  d="M191 118 L207 118 L211 120 L207 122 L191 122 Z"
                  fill="#e55630"
                />
              </g>
              <circle cx="120" cy="120" r="12" fill="#131d20" opacity=".5" />
              <circle
                cx="120"
                cy="119"
                r="10"
                fill="url(#chrome)"
                stroke="#a1aaa2"
              />
              <circle cx="118" cy="116" r="3" fill="#f4f2df" opacity=".7" />
            </svg>
          </div>
          <span
            class="speed-hint"
            role="img"
            aria-label="Hold Space to accelerate"
            title="Hold Space to accelerate"
            ><svg viewBox="0 0 48 22" width="48" height="22" aria-hidden="true">
              <rect
                x="1"
                y="1"
                width="46"
                height="19"
                rx="4"
                fill="none"
                stroke="currentColor"
              />
              <path
                d="M2 17v1a3 3 0 0 0 3 3h38a3 3 0 0 0 3-3v-1M13 8v5h22V8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              /></svg
            ><span aria-hidden="true">Space</span></span
          >
        </div>
        <div class="utilities">
          <button
            id="sound"
            class="sound-button"
            aria-label="Turn street sound on"
          >
            <svg
              id="sound-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M11 4 5 9H2v6h3l6 5V4Z" />
              <path id="sound-waves" d="m16 9 6 6m0-6-6 6" /></svg
            ><span id="sound-label">Sound off</span></button
          ><input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
            aria-label="Street sound volume"
          /><span class="control-divider"></span
          ><button
            id="cinema"
            class="round-button"
            aria-label="Toggle cinema mode"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
            </svg>
          </button>
        </div>
      </footer>
      <div id="cinema-hint">Press H to bring the city controls back</div>
      <div id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
