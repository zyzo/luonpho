<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e6db" />
    <meta name="description" content="Lượn Phố — a three-minute motorcycle daydream through the beautiful chaos of a Vietnamese street." />
    <title>Lượn Phố — A little ride through Vietnam</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23de512f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='48' fill='%23fff2cf'%3El%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="Animated third-person motorcycle ride through a Vietnamese street"></div>
      <div class="vignette"></div>
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Lượn Phố home">lượn phố<span class="brand-dot">.</span></a>
      </header>
      <section class="intro" id="intro">
        <h1>Hop on.<br>Feel the <em>Viet street.</em></h1>
        <button id="start" class="start-button"><span class="play-icon">▶</span> Take a ride <span class="button-arrow">↗</span></button>
      </section>
      <aside class="place-caption"><span class="place">Sài Gòn <span> / </span> Giờ tan tầm</span></aside>
      <footer class="ride-controls">
        <div class="playback"><button id="play" class="round-button play-control" aria-label="Pause ride">Ⅱ</button></div>
        <div class="utilities"><button id="sound" class="sound-button" aria-label="Turn street sound on"><svg id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path id="sound-waves" d="m16 9 6 6m0-6-6 6"/></svg><span id="sound-label">Sound off</span></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Street sound volume"/><span class="control-divider"></span><button id="cinema" class="round-button" aria-label="Toggle cinema mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
      </footer>
      <div id="cinema-hint">Press H to bring the city controls back</div>
      <div id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
