name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/chucongan/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/chucongan
      - run: npm run check
      - run: npm run review:check
      - run: npm run build
