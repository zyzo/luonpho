services:
  chucongan:
    build:
      context: ../..
      dockerfile: services/chucongan/Dockerfile
    environment:
      DATABASE_URL: postgres://chucongan:chucongan@postgres:5432/chucongan
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set in environment}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set in environment}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?set in environment}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chucongan
      POSTGRES_USER: chucongan
      POSTGRES_PASSWORD: chucongan
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chucongan -d chucongan']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - chucongan-postgres:/var/lib/postgresql/data

volumes:
  chucongan-postgres:
